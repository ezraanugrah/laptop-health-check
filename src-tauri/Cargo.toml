[package]
name = "laptop-health-check"
version = "0.1.0"
description = "Laptop Health Check - cek kesehatan laptopmu"
authors = ["Ezra Alfa Anugrahni"]
repository = "https://github.com/ezraanugrah/laptop-health-check"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "laptop_health_check_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# API native macOS (read-only / UI): CoreWLAN (status Wi-Fi), NSTouchBar (tes Touch Bar),
# NSSavePanel (pengguna memilih lokasi ekspor laporan). Fitur minimal, tanpa default.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSSet", "NSURL", "NSObject", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSControl", "NSButton", "NSColor", "NSTouchBar", "NSTouchBarItem", "NSCustomTouchBarItem", "NSSavePanel", "NSPanel", "NSApplication"] }


# Hemat disk & waktu build saat pengembangan: dependency dan build script
# dikompilasi tanpa debuginfo (crate aplikasi tetap punya debuginfo penuh).
[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
